name: Navigation Quality

on:
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/navigation-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Install geometry build dependency
        run: python -m pip install -r requirements-navigation.txt
      - name: Rebuild spatial and migrated graph data
        run: npm run build:navigation
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm run test:navigation
      - name: Full graph regression
        run: npm run audit:navigation
      - name: Production build
        run: npm run build
      - name: Upload route quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-quality
          path: ui/reports/navigation-quality.json
          if-no-files-found: warn
