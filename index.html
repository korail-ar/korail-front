<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>대전역 3층 길찾기 테스트</title><link rel="stylesheet" href="/station-route.css"><script type="module" src="/station-route.js"></script></head>
<body><main><nav aria-label="서비스 메뉴"><a href="/" aria-current="page">3층 지도</a><a href="/festivals.html">축제 정보</a></nav><header><div><small>대전역 · 3층</small><h1>실내 길찾기 테스트</h1></div></header>
<section class="controls"><div class="fields"><label>출발지<input id="from" autocomplete="off" placeholder="예: 서문 엘리베이터" aria-controls="fromResults"><div id="fromResults" class="results"></div></label><label>목적지<input id="to" autocomplete="off" placeholder="예: 매표소" aria-controls="toResults"><div id="toResults" class="results"></div></label></div><button id="route" class="primary">경로 보기</button><p id="routeStatus" role="status">시설을 검색해 선택하세요.</p></section>
<section class="map-section"><div class="map-head"><strong>3층 지도</strong><div><button id="zoomOut" aria-label="축소">−</button><button id="zoomIn" aria-label="확대">＋</button><button id="zoomReset">원래 크기</button></div></div><div id="viewport" class="viewport"><div id="scene" class="scene"><svg id="map" viewBox="0 0 2048 1386" role="img" aria-label="대전역 3층 실내 경로"><image href="/assets/daejeon_3d_F3(5).png" x="0" y="0" width="2048" height="1386"/><g id="routeLayer"></g><g id="gpsLayer"></g></svg></div></div></section>
<section class="gps"><div class="gps-title"><h2>휴대폰 GPS 테스트</h2><div><button id="gpsOn">내 위치 켜기</button><button id="gpsOff" disabled>내 위치 끄기</button></div></div><dl><div><dt>상태</dt><dd id="gpsStatus">꺼짐</dd></div><div><dt>위도</dt><dd id="lat">—</dd></div><div><dt>경도</dt><dd id="lng">—</dd></div><div><dt>정확도</dt><dd id="accuracy">—</dd></div><div><dt>마지막 갱신</dt><dd id="updated">—</dd></div><div><dt>지도 보정</dt><dd id="calibration">불러오는 중</dd></div><div><dt>독립 검증 오차</dt><dd id="validation">—</dd></div></dl><p class="note">GPS는 층을 판별하지 않습니다. 출발지는 검색에서 직접 선택하세요.</p></section></main></body></html>
