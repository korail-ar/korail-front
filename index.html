<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10294a">
  <title>대전역 3층 길찾기</title>
  <link rel="stylesheet" href="/station-route.css">
  <script type="module" src="/station-route.js"></script>
</head>
<body>
  <main>
    <nav class="site-nav" aria-label="서비스 메뉴">
      <a class="brand" href="/" aria-label="대전역 안내 홈">대전역 안내</a>
      <div class="nav-links"><a href="/" aria-current="page">3층 길찾기</a><a href="/festivals.html">축제 정보</a></div>
    </nav>

    <header class="hero">
      <span class="eyebrow">DAEJEON STATION · FLOOR 3</span>
      <h1>대전역 3층 길찾기</h1>
      <p>출발지와 목적지를 선택하면 지도와 단계별 경로를 보여드립니다.</p>
    </header>

    <section class="controls" aria-labelledby="searchTitle">
      <div class="section-heading"><span class="section-index">01</span><div><h2 id="searchTitle">어디로 가시나요?</h2><p>시설 이름을 입력하고 검색 결과에서 선택해 주세요.</p></div></div>
      <div class="fields">
        <label><span class="field-label"><span class="field-dot start-dot"></span>출발지</span><input id="from" autocomplete="off" placeholder="예: 서광장 엘리베이터" aria-controls="fromResults"><span id="fromResults" class="results"></span></label>
        <label><span class="field-label"><span class="field-dot end-dot"></span>목적지</span><input id="to" autocomplete="off" placeholder="예: 매표소" aria-controls="toResults"><span id="toResults" class="results"></span></label>
      </div>
      <div class="search-actions"><p id="routeStatus" role="status">시설을 검색해 선택하세요.</p><button id="route" class="primary">경로 보기 <span aria-hidden="true">→</span></button></div>
      <div class="category-filter"><div class="category-heading"><strong>시설 종류</strong><span id="categoryStatus">지도 아이콘을 선택하면 목적지에 입력됩니다.</span></div><div id="categoryChips" class="category-chips" role="group" aria-label="시설 종류 필터"></div></div>
    </section>

    <section id="routeSummary" class="route-summary" hidden aria-label="선택한 경로"><span>선택한 경로</span><strong id="routeSummaryText"></strong></section>

    <section class="map-section" aria-labelledby="mapTitle">
      <div class="map-head"><div><span class="section-index">02</span><div><h2 id="mapTitle">3층 지도</h2><p>경로를 선택하면 지도 위에 표시됩니다.</p></div></div><div class="map-tools"><button id="zoomOut" aria-label="지도 축소">−</button><button id="zoomIn" aria-label="지도 확대">＋</button><button id="zoomReset">원래 크기</button></div></div>
      <div id="viewport" class="viewport"><div id="scene" class="scene"><svg id="map" viewBox="0 0 2048 1386" role="img" aria-label="대전역 3층 실내 경로"><image href="/assets/daejeon_3d_F3(5).png" x="0" y="0" width="2048" height="1386"/><g id="placeLayer"></g><g id="routeLayer"></g><g id="demoLayer"></g></svg></div></div>
      <p class="map-note"><span class="legend-dot start-dot"></span> 출발 <span class="legend-dot end-dot"></span> 도착 <span class="legend-line"></span> 안내 경로 <span class="legend-dot demo-dot"></span> 시연 위치</p>
    </section>

    <section id="routeDetails" class="route-details" hidden aria-labelledby="detailTitle"><div class="detail-heading"><div class="section-heading"><span class="section-index">03</span><div><h2 id="detailTitle">상세 경로</h2><p>단계를 누르면 지도에서 해당 구간을 볼 수 있습니다.</p></div></div><span id="stepCount"></span></div><div id="stepCards" class="step-cards"></div></section>

  </main>
  <footer class="site-footer"><a href="/gps-test.html">GPS 기능 테스트</a></footer>
</body>
</html>
